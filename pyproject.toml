[project]
name = "jeff-contacts"
version = "0.1.13"
description = "CRM Markdown synchronisé depuis CardDAV (Baikal), publié en site statique Hugo."
authors = [
    { name = "lduchosal" },
]
requires-python = ">=3.11"
readme = "README.md"
keywords = [
    "crm",
    "carddav",
    "vcard",
    "markdown",
    "hugo",
    "contacts",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
]
dependencies = [
    "requests>=2.28",
    "lxml>=5.0",
    "vobject>=0.9.8",
    "jinja2>=3.1",
    "click>=8.1",
    "pyyaml>=6.0",
    "kenboard>=0.1.92",
    "graphviz>=0.20",
]

[project.license]
text = "MIT"

[project.scripts]
jeff = "jeff.cli:cli"

[dependency-groups]
dev = [
    "pdm>=2.26.0",
    "pdm-bump>=0.9.0",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.2.0",
    "httpx>=0.24.0",
    "black>=25.0",
    "isort>=6.0",
    "docformatter>=1.7",
    "ruff>=0.13.0",
    "flake8>=7.3",
    "flake8-docstrings>=1.7.0",
    "flake8-docstrings-complete>=1.3.0",
    "mypy>=1.18",
    "interrogate>=1.7.0",
    "vulture>=2.14",
    "refurb>=2.2.0",
    "absolufy-imports>=0.3.1",
]
publish = [
    "twine>=6.2.0",
    "keyring>=25.7.0",
]

[build-system]
requires = [
    "pdm-backend",
]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
test = "pytest tests/ -q --tb=short"
test-quick = "pytest tests/ -q --tb=short -x"
test-ci = "pytest tests/ -q --tb=short --cov=src/jeff --cov-report=xml --cov-report=term"
test-unit = "pytest tests/unit/ -q --tb=short"
test-integration = "pytest tests/integration/ -q --tb=short"
test-cov = "pytest tests/ -q --tb=short --cov=src/jeff --cov-report=term-missing --cov-report=html"
format = "black src/ tests/"
isort = "isort src/ tests/"
lint = "ruff check --fix src/ tests/"
flake8 = "flake8 src/"
typecheck = "mypy src/"
interrogate = "interrogate src/"
vulture = "vulture src/ tests/ vulture_whitelist.py"
refurb = "refurb src/"
clean = "rm -rf dist/ build/ .mypy_cache/ .pytest_cache/ htmlcov/ .coverage"
install = "pdm install"
install-dev = "pdm install -G dev"
version-show = "python -c \"import jeff; print(jeff.__version__)\""
version-patch = "pdm bump -v patch"
version-minor = "pdm bump -v minor"
version-major = "pdm bump -v major"

[tool.pdm.scripts.docformatter]
shell = "docformatter --recursive --in-place --wrap-summaries 88 --wrap-descriptions 88 --close-quotes-on-newline src/ tests/ || [ $? -eq 3 ]"

[tool.pdm.scripts.absolufy]
shell = "find src/ -name '*.py' -exec absolufy-imports {} +"

[tool.pdm.scripts.check]
composite = [
    "isort",
    "docformatter",
    "format",
    "typecheck",
    "flake8",
    "interrogate",
    "refurb",
    "lint",
    "vulture",
    "test-quick",
]

[tool.pdm-bump]
version-files = [
    "src/jeff/__init__.py:__version__",
]

[tool.black]
line-length = 88
target-version = [
    "py311",
]

[tool.isort]
profile = "black"
src_paths = [
    "src",
    "tests",
]
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "unit: marks unit tests",
]

[tool.coverage.run]
source = [
    "src/jeff",
]
omit = [
    "tests/*",
    "src/jeff/__main__.py",
]

[tool.coverage.report]
fail_under = 75
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
]

[tool.vulture]
min_confidence = 80
paths = [
    "src",
    "tests",
]

[tool.interrogate]
fail-under = 95
ignore-init-method = true
ignore-init-module = true
exclude = [
    "tests",
    "docs",
    "build",
    "dist",
]
generate-badge = "."

[tool.docformatter]
recursive = true
wrap-summaries = 88
wrap-descriptions = 88
close-quotes-on-newline = true
